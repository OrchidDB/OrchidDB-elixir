name: Release Hex
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (v0.1.0)
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: hex
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Read compiler pins
        id: pins
        shell: bash
        run: |
          echo "native=$(cat NATIVE_REVISION)" >> "$GITHUB_OUTPUT"
          echo "core=$(cat CORE_REVISION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: OrchidDB/OrchidDB-native
          ref: ${{ steps.pins.outputs.native }}
          path: compiler/orchiddb-native
      - uses: actions/checkout@v4
        with:
          repository: OrchidDB/OrchidDB
          ref: ${{ steps.pins.outputs.core }}
          path: compiler/orchiddb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/orchiddb-native
      - name: Build pinned compiler
        env:
          ORCHIDDB_RELEASE_BUILD: '1'
        shell: bash
        run: cargo build --locked --release --manifest-path compiler/orchiddb-native/Cargo.toml
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - run: mix deps.get
      - name: Test native compiler and Arrow C Stream
        env:
          ORCHIDDB_NATIVE_LIBRARY: ${{ github.workspace }}/compiler/orchiddb-native/target/release/liborchiddb_compiler.so
        run: |
          mix format --check-formatted
          mix test
          mix hex.build
      - name: Verify version and publish
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          mix run -e 'unless System.get_env("RELEASE_TAG") == "v" <> Mix.Project.config()[:version], do: raise("Tag/version mismatch")'
          mix hex.publish package --yes
